# Snippets to merge into HomeAssistant configuration.yaml
# Irin battery monitor ("Uncharted 12V" instance)

# =============================================================================
# Automations
# =============================================================================
# Core alerts are required. The charger file is optional — see its header.
#
#   automation core: !include ha_config/automations.yaml
#   automation charger: !include ha_config/automations_charger_optional.yaml

# =============================================================================
# Helper sensors — ONLY needed for the optional charger control loop
# =============================================================================
sensor:
  # Smooths the maintainer's float-mode pulsing so termination is reliable.
  # Without this, a pulse every 20 min resets an instantaneous threshold forever
  # and the charger runs to its 24 h backstop every cycle.
  - platform: statistics
    name: "Uncharted Charger Power 1h"
    unique_id: uncharted_charger_power_1h
    entity_id: sensor.uncharted_charger_plug_power
    state_characteristic: mean
    max_age:
      hours: 1
    sampling_size: 200

  # Intervention rate — the number that reveals whether the car has a fault
  # rather than merely a flat battery.
  - platform: history_stats
    name: "Uncharted Charger Starts 7d"
    unique_id: uncharted_charger_starts_7d
    entity_id: switch.uncharted_charger_plug
    state: "on"
    type: count
    duration:
      days: 7
    end: "{{ now() }}"

# =============================================================================
# Recorder — keep voltage history long enough to be useful
# =============================================================================
# Voltage is the diagnostic record. Default purge (10 days) is too short to
# characterize DC-DC cycling across seasons or to support a warranty argument.
#
# READ BEFORE UNCOMMENTING: recorder `include` is an ALLOW-LIST and it applies
# to the whole of Home Assistant, not to this device. Pasting the block below
# as-is silently stops recording every other entity in the house. If you already
# have a recorder: block, merge purge_keep_days into it and leave its filters
# alone. If you don't, raise purge_keep_days on its own and skip the include —
# 90 days of everything is cheap next to losing the rest of your history.
#
# recorder:
#   purge_keep_days: 90
#
# Only if you genuinely want an allow-list for the entire instance:
#   include:
#     entities:
#       - sensor.uncharted_12v_battery_voltage
#       - sensor.uncharted_12v_battery_soc
#       - sensor.uncharted_12v_time_since_charging
#       - binary_sensor.uncharted_12v_charging

# =============================================================================
# TUNING VALUES
# =============================================================================
#
#  DONE — ESPHome calibrate_linear
#       Two-point against a DVM at 11.50 V and 15.00 V, redone 2026-10-06 after
#       the analog-ground fix. Fitted gain 5.7211 against a measured resistor
#       ratio of 5.7208. Reads 12.22 V at the 50% point and 16.00 V at full
#       scale. Nothing further needed unless the divider is rebuilt.
#
#  OPEN — DC-DC stall threshold (automations.yaml, currently 12 h)
#       Observe the normal maximum gap between charging runs over the first
#       week; roughly double it. Leave that automation DISABLED until then.
#
#  OPEN — Charger float threshold (optional loop, currently 20 W)
#       Only matters if you build the optional maintainer loop. Run one full
#       charge cycle manually and watch the power trace. Note the bulk draw
#       (likely 60-90 W) and the float mean (a few watts). Set between them.
